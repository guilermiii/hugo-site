baseURL: https://example.org/
locale: pt-br
title: K apply -f guilermiii.yaml
module:
  imports:
    - path: github.com/imfing/hextra
menu:
  main:
    - name: Documentos
      pageRef: /docs
      weight: 1
    - name: Banana Blog
      pageRef: /blog
      weight: 2
    - name: Sobre
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/guilermiii/blog-banana-ops"
      params:
        icon: github
    - name: Theme Toggle
      weight: 6 
      params:
        type: theme-toggle
        label: true # optional, default is false
    - name: Language Switcher
      weight: 7
      params:
        type: language-switch
        label: true # optional, default is false
        icon: "globe-alt" # optional, default is "translate"
    ## configurar corretamente no futuro para meu portifolio    
    - identifier: sdk
      name: SDK
    - identifier: python
      name: Python ↗
      url: https://python.org
      parent: sdk
    - identifier: go
      name: Go
      url: https://go.dev
      parent: sdk

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

params:
  page:
    displayPagination: false  # for docs pages
  blog:
    article:
      displayPagination: false  # for blog articles
    list:
      displayTags: true
  imageZoom:
    enable: true

